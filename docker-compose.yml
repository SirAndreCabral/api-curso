services:

  postgres:
    image: postgres:16
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_cursos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build: .
    restart: always

    depends_on:
      - postgres

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/api_cursos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    ports:
      - "8080:8080"


volumes:
  postgres_data:
